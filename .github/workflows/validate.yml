name: Validate MeguRig
on:
  pull_request:
  push:
    branches:
      - main
      - feat/**
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js engine/*.js; do node --check "$file"; done
      - name: Regression and security checks
        run: node ci-test.mjs
      - name: Engine foundation tests
        shell: bash
        run: |
          set -euo pipefail
          node engine/core.test.mjs
          node engine/webgl2-renderer.test.mjs
