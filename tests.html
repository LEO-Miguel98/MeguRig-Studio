<!doctype html><html lang="en"><head><meta charset="utf-8"><title>MeguRig Smoke Tests</title></head><body><pre id="out">Running…</pre><script src="mesh.js"></script><script src="validator.js"></script><script>"use strict";(()=>{const out=document.getElementById("out"),results=[];function test(name,fn){try{fn();results.push([name,true])}catch(e){results.push([name,false,e.message])}}function ok(v,m){if(!v)throw new Error(m)}test("mesh API loads",()=>ok(window.MeguMesh,"MeguMesh missing"));test("validator API loads",()=>ok(window.MeguValidator,"MeguValidator missing"));test("empty project fails readiness",()=>{const r=MeguValidator.inspect({layers:[],parameters:{}});ok(!r.ok,"empty project should fail")});test("minimal structured rig validates",()=>{const roles=["face","eye-left","eye-right","mouth","body"],layers=roles.map((role,i)=>({name:role,fileName:`${role}.png`,role,keyforms:i?{}:{ParamAngleX:[{value:-30},{value:30}]},physics:{enabled:false}})),parameters={ParamAngleX:0,ParamAngleY:0,ParamBodyAngleZ:0,ParamEyeOpen:1,ParamMouthOpenY:0},r=MeguValidator.inspect({layers,parameters});ok(r.ok,"minimal rig has structural error");ok(r.stats.layers===5,"wrong layer count")});const failed=results.filter(x=>!x[1]);out.textContent=results.map(x=>`${x[1]?"PASS":"FAIL"} ${x[0]}${x[2]?`: ${x[2]}`:""}`).join("\n")+`\n\n${failed.length?`${failed.length} failed`:`All ${results.length} tests passed`}`;document.title=failed.length?"FAIL — MeguRig Tests":"PASS — MeguRig Tests";document.body.dataset.failed=String(failed.length)})();</script></body></html>
